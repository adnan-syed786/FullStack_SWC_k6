<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q12 Autocomplete Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="search-card" aria-labelledby="search-title">
      <p class="eyebrow">Question 12</p>
      <h1 id="search-title">Autocomplete Search</h1>
      <p class="intro">Type a query, review matching suggestions, move with arrow keys, and press Enter to select.</p>

      <div class="combobox">
        <label for="searchInput">Search topics</label>
        <input id="searchInput" type="text" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggestionList" aria-activedescendant="" placeholder="Try analytics, camera, dashboard...">
        <ul class="suggestions" id="suggestionList" role="listbox" aria-label="Search suggestions" hidden></ul>
      </div>

      <p class="selection" id="selection" aria-live="polite">No suggestion selected yet.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
