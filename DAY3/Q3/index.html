<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reusable Product Image Carousel</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="page">
        <section class="product-card">
            <div
                class="carousel"
                data-carousel
                data-interval="3000"
                aria-label="Product images"
            >
                <div class="carousel__viewport">
                    <div class="carousel__track">
                        <div class="carousel__slide">
                            <img
                                src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&amp;fit=crop&amp;w=1200&amp;q=85"
                                alt="Black over-ear headphones on a yellow background"
                            >
                        </div>
                        <div class="carousel__slide">
                            <img
                                src="https://images.unsplash.com/photo-1484704849700-f032a568e944?auto=format&amp;fit=crop&amp;w=1200&amp;q=85"
                                alt="Black wireless headphones viewed from the side"
                            >
                        </div>
                        <div class="carousel__slide">
                            <img
                                src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&amp;fit=crop&amp;w=1200&amp;q=85"
                                alt="Premium black headphones resting on a dark surface"
                            >
                        </div>
                        <div class="carousel__slide">
                            <img
                                src="https://images.unsplash.com/photo-1583394838336-acd977736f90?auto=format&amp;fit=crop&amp;w=1200&amp;q=85"
                                alt="Close-up product photo of black over-ear headphones"
                            >
                        </div>
                    </div>

                    <button class="carousel__button carousel__button--previous" type="button" aria-label="Previous image">
                        &#10094;
                    </button>
                    <button class="carousel__button carousel__button--next" type="button" aria-label="Next image">
                        &#10095;
                    </button>

                    <div class="carousel__counter" aria-live="polite">
                        <span data-current-slide>1</span> / <span data-total-slides>4</span>
                    </div>
                </div>

                <div class="carousel__dots" aria-label="Choose an image"></div>
            </div>

            <div class="product-info">
                <span class="product-info__tag">NEW ARRIVAL</span>
                <h1>Pulse Pro Wireless</h1>
                <p class="product-info__rating">4.8 <span aria-hidden="true">&#9733;</span> (1,248 reviews)</p>
                <p class="product-info__description">
                    Immersive sound, adaptive noise cancellation, and up to 40 hours of battery life.
                </p>
                <div class="product-info__price">
                    <strong>$129.99</strong>
                    <del>$179.99</del>
                    <span>28% off</span>
                </div>
                <button class="add-to-cart" type="button">Add to cart</button>
            </div>
        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
